<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0051B3" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <!-- Map Grid Lines / Meridian -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <ellipse cx="64" cy="64" rx="22" ry="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="20" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="64" y1="20" x2="64" y2="108" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <!-- GIS Map Pin -->
  <g filter="url(#shadow)">
    <path d="M64 26 C49.6 26 38 37.6 38 52 C38 72 64 98 64 98 C64 98 90 72 90 52 C90 37.6 78.4 26 64 26 Z" fill="url(#pinGrad)" />
    <circle cx="64" cy="50" r="11" fill="#FFFFFF" />
    <circle cx="64" cy="50" r="5" fill="#007AFF" />
  </g>
</svg>
